name: Build Gusar Scanner APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📦 Detect Project Directory & Install Dependencies
        run: |
          if [ -d "scanner-app" ]; then
            cd scanner-app
          fi
          flutter pub get

      - name: 🔑 Ensure Permanent Release Keystore
        run: |
          if [ -d "scanner-app" ]; then
            cd scanner-app
          fi
          KEYSTORE="android/app/gusar_release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias gusarkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gusar_pass_2026 \
              -keypass gusar_pass_2026 \
              -dname "CN=Gusar, OU=IT, O=Gusar TJ, L=Dushanbe, ST=Dushanbe, C=TJ"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE"
            git commit -m "chore: add permanent release keystore [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: 🛠️ Build Release APK
        run: |
          if [ -d "scanner-app" ]; then
            cd scanner-app
          fi
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk Gusar-Scanner.apk
          RAW_VER=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VER=v$RAW_VER" >> $GITHUB_ENV
          echo "Detected version: v$RAW_VER"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gusar-scanner-apk
          path: Gusar-Scanner.apk

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Gusar-Scanner.apk
          tag_name: ${{ env.APP_VER }}
          name: Gusar Scanner ${{ env.APP_VER }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Gusar Scanner APK — Релиз ${{ env.APP_VER }}
            
            Обновление мобильного приложения приёмки товаров для сети **Gusar (gusar.tj)**.
            
            ### ✨ Новые возможности:
            - ➕ **Добавление новых товаров прямо из приложения:**
              - 🏷️ Штрихкод (штучный товар) со встроенным сканером камеры и автогенерацией EAN-13
              - 🔢 Внутренний артикул / код без заводского штрихкода
              - ⚖️ Весы (весовой товар в кг, код PLU и расчёт весового штрихкода)
            - 📸 **Привязка и интеллектуальное сжатие фотографий товаров:**
              - Поиск товаров по названию и по штрихкоду
              - Фотографирование на камеру или выбор из галереи
              - Автоматическое сжатие без потери качества и резкости текста
              - Редактирование: поворот на 90 градусов, замена, удаление, полноэкранный зум
            - 🧠 Интеллектуальный OCR с распознаванием таджикского и русского языков
            - ⚡ Мгновенная привязка товаров к накладной
            - 🔍 Сверка штрихкодов коробок (EAN-13, DataMatrix, весовые 20-29)
            - 📲 Встроенное самообновление APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
