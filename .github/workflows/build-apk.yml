name: Build Gusar Scanner APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📦 Detect Project Directory & Install Dependencies
        run: |
          if [ -d "scanner-app" ]; then
            cd scanner-app
          fi
          flutter pub get

      - name: 🔑 Ensure Permanent Release Keystore
        run: |
          if [ -d "scanner-app" ]; then
            cd scanner-app
          fi
          KEYSTORE="android/app/gusar_release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias gusarkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gusar_pass_2026 \
              -keypass gusar_pass_2026 \
              -dname "CN=Gusar, OU=IT, O=Gusar TJ, L=Dushanbe, ST=Dushanbe, C=TJ"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE"
            git commit -m "chore: add permanent release keystore [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: 🛠️ Build Release APK
        run: |
          if [ -d "scanner-app" ]; then
            cd scanner-app
          fi
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../Gusar-Scanner-${{ github.ref_name || 'latest' }}.apk 2>/dev/null || cp build/app/outputs/flutter-apk/app-release.apk Gusar-Scanner-${{ github.ref_name || 'latest' }}.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gusar-scanner-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'

      - name: 🚀 Create GitHub Release (on Tag or Dispatch or Main)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: '**/Gusar-Scanner-*.apk'
          tag_name: ${{ github.ref_name == 'main' && 'V1.0.0' || github.ref_name || format('v{0}', inputs.version_name) }}
          name: Gusar Scanner ${{ github.ref_name == 'main' && '1.0.0' || github.ref_name || format('v{0}', inputs.version_name) }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Gusar Scanner APK — Релиз
            
            Обновление мобильного приложения приёмки товаров для сети **Gusar (gusar.tj)**.
            
            ### ✨ Возможности:
            - 📷 Сканирование накладных (ТОРГ-12) и кассовых чеков.
            - 🧠 Интеллектуальный OCR с распознаванием таджикского и русского языков.
            - ⚡ Мгновенная привязка товаров: «Один пик с коробки» + обучаемый словарь сети.
            - 🔍 Сверка штрихкодов коробок (EAN-13, DataMatrix, весовые штрихкоды 20-29).
            - 💰 Автоконтроль скачка закупочных цен и отрицательной маржи.
            - 📑 Акт расхождений с цифровой росписью водителя на экране.
            - 🔄 Прямое пополнение остатков в системе `gusar.tj`.
            - 📲 Встроенное самообновление APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
